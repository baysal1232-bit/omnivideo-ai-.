name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android projesini bul
        shell: bash
        run: |
          echo "=== ANDROID PROJESI ARANIYOR ==="

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı!"
            echo "=== DOSYALAR ==="
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Bulunan proje:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle Build
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJE KLASÖRÜ ==="
          pwd

          echo "=== DOSYALAR ==="
          ls -la

          echo "=== APK DERLEME ==="
          gradle assembleDebug --stacktrace
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Zone-Debug-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
Sonra

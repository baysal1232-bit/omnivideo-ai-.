name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android projesini ZIP'ten çıkar
        run: |
          echo "=== ZIP DOSYASI ==="
          ls -la

          if [ ! -f "omnivideo-ai-fixed.zip" ]; then
            echo "HATA: omnivideo-ai-fixed.zip bulunamadı!"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project

          unzip -q "omnivideo-ai-fixed.zip" -d android-project

          echo "=== ZIP ICERIGI ==="
          find android-project -maxdepth 6 -type f | sort

      - name: Android projesini bul
        run: |
          echo "=== ANDROID PROJESI ARANIYOR ==="

          SETTINGS=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "settings dosyası: $SETTINGS"
          echo "PROJE KLASORU: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Google Services dosyasını kontrol et
        run: |
          echo "=== GOOGLE SERVICES ARANIYOR ==="

          GOOGLE_FILE=$(find "$PROJECT_DIR" -type f -name "google-services.json" | head -n 1)

          if [ -n "$GOOGLE_FILE" ]; then
            echo "Google Services bulundu:"
            echo "$GOOGLE_FILE"

            if [ "$GOOGLE_FILE" != "$PROJECT_DIR/app/google-services.json" ]; then
              mkdir -p "$PROJECT_DIR/app"
              cp "$GOOGLE_FILE" "$PROJECT_DIR/app/google-services.json"
              echo "google-services.json app klasörüne kopyalandı."
            fi
          else
            echo "UYARI: google-services.json bulunamadı."
            echo "Firebase kullanan uygulamalarda build başarısız olabilir."
          fi

      - name: Debug keystore oluştur
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            echo "=== DEBUG KEYSTORE OLUŞTURULUYOR ==="

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore başarıyla oluşturuldu."
          else
            echo "debug.keystore zaten mevcut."
          fi

      - name: Proje dosyalarını kontrol et
        run: |
          echo "=== PROJE DOSYALARI ==="
          cd "$PROJECT_DIR"
          ls -la

          echo "=== APP DOSYALARI ==="
          find app -maxdepth 3 -type f | sort

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"

          echo "=== APK BUILD BAŞLIYOR ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew bulunamadı."
            echo "Sistem Gradle kullanılacak."
            gradle assembleDebug --stacktrace
          fi

      - name: APK dosyasını bul
        run: |
          echo "=== APK DOSYALARI ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: OmniVideo-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Proje dosyalarını kontrol et
        run: |
          echo "=== PROJE DOSYALARI ==="
          ls -la
          echo ""
          echo "=== ALT KLASÖRLER ==="
          find . -maxdepth 2 -type f | sort

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Wrapper kontrolü
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "HATA: gradlew bulunamadı!"
            echo "Android projesi GitHub deposunda yok."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "HATA: Gradle Wrapper bulunamadı!"
            exit 1
          fi

          chmod +x ./gradlew

      - name: Gradle Build
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK oluştur
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Zone-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk

name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android projesini ZIP'ten çıkar
        run: |
          echo "=== ZIP DOSYASI ==="
          ls -la

          if [ ! -f "omnivideo-ai-fixed.zip" ]; then
            echo "HATA: omnivideo-ai-fixed.zip bulunamadı!"
            exit 1
          fi

          mkdir -p android-project
          unzip -q "omnivideo-ai-fixed.zip" -d android-project

          echo "=== ZIP ICERIGI ==="
          find android-project -maxdepth 5 -type f | sort

      - name: Android projesini bul
        run: |
          echo "=== ANDROID PROJESI ARANIYOR ==="

          SETTINGS=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: ZIP'in içinde settings.gradle bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "settings dosyası: $SETTINGS"
          echo "PROJE KLASORU: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle ile APK oluştur
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJE DOSYALARI ==="
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew bulunamadı, sistem Gradle kullanılacak."
            gradle assembleDebug --stacktrace
          fi

      - name: APK bul
        run: |
          echo "=== APK DOSYALARI ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: OmniVideo-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
